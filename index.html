<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ff8fba">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Um pedido especial ♥</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span>♥</span><span>♥</span><span>♥</span><span>♥</span>
    <span>♥</span><span>♥</span><span>♥</span><span>♥</span>
    <span>♥</span><span>♥</span>
  </div>

  <main class="card">
    <div class="heart-main">♥</div>
    <p class="eyebrow">Tenho uma pergunta especial...</p>
    <h1>Quer namorar<br>comigo?</h1>
    <p class="subtitle">Prometo muitos sorrisos e momentos felizes! ♥</p>

    <div class="buttons" id="buttonArea">
      <button class="yes" id="yes">SIM ♥</button>
      <button class="no" id="no">Não</button>
    </div>

    <p class="hint">Tente tocar no "Não" 😏</p>
  </main>

  <div class="overlay" id="overlay">
    <div class="success">
      <div class="success-heart">♥</div>
      <h2>AEEE! ♥</h2>
      <p>Você disse SIM!</p>
      <p class="small">Agora começou uma história muito especial. ✨</p>
      <button id="close">Fechar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
